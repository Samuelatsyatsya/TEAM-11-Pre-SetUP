name: ${COMPOSE_PROJECT_NAME}

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: ${POSTGRES_RESTART_POLICY}
    command: ["postgres", "-p", "${DB_PORT}"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${POSTGRES_INIT_SCRIPT}:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME} -p ${DB_PORT}"]
      interval: ${DOCKER_HEALTHCHECK_INTERVAL}
      timeout: ${DOCKER_HEALTHCHECK_TIMEOUT}
      retries: ${DOCKER_HEALTHCHECK_RETRIES}
      start_period: ${POSTGRES_HEALTHCHECK_START_PERIOD}
    mem_limit: ${POSTGRES_MEM_LIMIT}
    cpus: ${POSTGRES_CPUS}

  api:
    build:
      context: ${BACKEND_BUILD_CONTEXT}
      dockerfile: ${BACKEND_DOCKERFILE}
      args:
        BACKEND_BUILD_IMAGE: ${BACKEND_BUILD_IMAGE}
        BACKEND_RUNTIME_IMAGE: ${BACKEND_RUNTIME_IMAGE}
        APP_USER: ${BACKEND_APP_USER}
        APP_GROUP: ${BACKEND_APP_GROUP}
        APP_HOME: ${BACKEND_APP_HOME}
        APP_PORT: ${API_PORT}
        APP_HEALTHCHECK_HOST: ${API_HEALTHCHECK_HOST}
        APP_HEALTHCHECK_PATH: ${API_HEALTHCHECK_PATH}
    restart: ${API_RESTART_POLICY}
    init: ${CONTAINER_INIT}
    security_opt:
      - no-new-privileges:${CONTAINER_NO_NEW_PRIVILEGES}
    read_only: ${API_READ_ONLY}
    tmpfs:
      - ${API_TMPFS_PATH}
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      SERVER_PORT: ${API_PORT}
      SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}
      APP_API_BASE_PATH: ${APP_API_BASE_PATH}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
      MANAGEMENT_HEALTH_PROBES_ENABLED: ${MANAGEMENT_HEALTH_PROBES_ENABLED}
      MANAGEMENT_HEALTH_SHOW_DETAILS: ${MANAGEMENT_HEALTH_SHOW_DETAILS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent ${API_HEALTHCHECK_SCHEME}://${API_HEALTHCHECK_HOST}:${API_PORT}${API_HEALTHCHECK_PATH} > /dev/null || exit 1"]
      interval: ${DOCKER_HEALTHCHECK_INTERVAL}
      timeout: ${DOCKER_HEALTHCHECK_TIMEOUT}
      retries: ${DOCKER_HEALTHCHECK_RETRIES}
      start_period: ${API_HEALTHCHECK_START_PERIOD}
    mem_limit: ${API_MEM_LIMIT}
    cpus: ${API_CPUS}

  frontend:
    build:
      context: ${FRONTEND_BUILD_CONTEXT}
      dockerfile: ${FRONTEND_DOCKERFILE}
      args:
        FRONTEND_NODE_IMAGE: ${FRONTEND_NODE_IMAGE}
        APP_PORT: ${FRONTEND_PORT}
        APP_BIND_HOST: ${FRONTEND_BIND_HOST}
        APP_USER: ${FRONTEND_APP_USER}
        APP_GROUP: ${FRONTEND_APP_GROUP}
        APP_HOME: ${FRONTEND_APP_HOME}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        FRONTEND_HEALTHCHECK_URL: ${FRONTEND_HEALTHCHECK_SCHEME}://${FRONTEND_HEALTHCHECK_HOST}:${FRONTEND_PORT}${FRONTEND_HEALTHCHECK_PATH}
        NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED}
    restart: ${FRONTEND_RESTART_POLICY}
    init: ${CONTAINER_INIT}
    security_opt:
      - no-new-privileges:${CONTAINER_NO_NEW_PRIVILEGES}
    read_only: ${FRONTEND_READ_ONLY}
    tmpfs:
      - ${FRONTEND_TMPFS_PATH}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      PORT: ${FRONTEND_PORT}
      HOSTNAME: ${FRONTEND_BIND_HOST}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL}
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent ${FRONTEND_HEALTHCHECK_SCHEME}://${FRONTEND_HEALTHCHECK_HOST}:${FRONTEND_PORT}${FRONTEND_HEALTHCHECK_PATH} > /dev/null || exit 1"]
      interval: ${DOCKER_HEALTHCHECK_INTERVAL}
      timeout: ${DOCKER_HEALTHCHECK_TIMEOUT}
      retries: ${DOCKER_HEALTHCHECK_RETRIES}
      start_period: ${FRONTEND_HEALTHCHECK_START_PERIOD}
    mem_limit: ${FRONTEND_MEM_LIMIT}
    cpus: ${FRONTEND_CPUS}

  data-engineering:
    build:
      context: ${DATA_ENGINEERING_BUILD_CONTEXT}
      dockerfile: ${DATA_ENGINEERING_DOCKERFILE}
      args:
        DATA_ENGINEERING_PYTHON_IMAGE: ${DATA_ENGINEERING_PYTHON_IMAGE}
        ETL_WORKDIR: ${ETL_WORKDIR}
        ETL_USER: ${ETL_USER}
        ETL_GROUP: ${ETL_GROUP}
        ETL_ENTRYPOINT: ${ETL_ENTRYPOINT}
    restart: ${ETL_RESTART_POLICY}
    init: ${CONTAINER_INIT}
    security_opt:
      - no-new-privileges:${CONTAINER_NO_NEW_PRIVILEGES}
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - ${ETL_PROFILE}

  mailhog:
    image: ${MAILHOG_IMAGE}
    restart: ${MAILHOG_RESTART_POLICY}
    environment:
      MH_SMTP_BIND_ADDR: ${MAILHOG_SMTP_BIND_ADDR}
      MH_UI_BIND_ADDR: ${MAILHOG_UI_BIND_ADDR}
    ports:
      - "${MAIL_PORT}:${MAIL_PORT}"
      - "${MAIL_UI_PORT}:${MAIL_UI_PORT}"
    mem_limit: ${MAILHOG_MEM_LIMIT}
    cpus: ${MAILHOG_CPUS}

  pgadmin:
    image: ${PGADMIN_IMAGE}
    restart: ${PGADMIN_RESTART_POLICY}
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: ${PGADMIN_PORT}
      PGADMIN_CONFIG_SERVER_MODE: ${PGADMIN_SERVER_MODE}
    ports:
      - "${PGADMIN_PORT}:${PGADMIN_PORT}"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: ${PGADMIN_MEM_LIMIT}
    cpus: ${PGADMIN_CPUS}
    profiles:
      - ${PGADMIN_PROFILE}

volumes:
  pgdata:
    name: ${PGDATA_VOLUME_NAME}
  pgadmin_data:
    name: ${PGADMIN_VOLUME_NAME}
