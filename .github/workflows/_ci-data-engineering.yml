name: _CI Data Engineering (Reusable)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-engineering:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-engineering
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-engineering/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Module import smoke check
        run: python -c "import config; import etl_pipeline"
