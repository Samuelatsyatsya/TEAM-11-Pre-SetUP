name: _CI QA (Reusable)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa/api-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile API tests
        run: mvn -B -ntp -DskipTests test-compile

  qa-ui-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa/ui-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile UI tests
        run: mvn -B -ntp -DskipTests test-compile
